  <div id="findme-page-transition-layer" class="fm-page-transition-layer"></div>
</body>

<style>
  * { box-sizing: border-box; letter-spacing: 0; }
  body { width: 100%; height: 100%; margin: 0; overflow: hidden; color: #1a2328; font-family: lxgw, sans-serif; font-size: 10px; background-color: rgba(229,232,231,0.97); }
  .house-root, .house-page { position: relative; width: 100%; height: 100%; overflow: hidden; }
  .fm-page-transition-layer { position: absolute; z-index: 260; left: 0; top: 0; display: block; overflow: hidden; pointer-events: none; }
  .fm-cinematic-motion { position: absolute; z-index: 1; display: block; overflow: hidden; pointer-events: none; }
  .fm-cine-dark,.fm-cine-light,.fm-cine-accent,.fm-cine-slice-a,.fm-cine-slice-b,.fm-cine-node { position: absolute; display: block; pointer-events: none; }
  .fm-cine-dark { z-index: 1; background-color: #182126; clip-path: polygon(0 0,100% 0,94% 100%,0 100%); }
  .fm-cine-light { z-index: 2; background-color: #e4e8e7; clip-path: polygon(10% 0,100% 0,100% 100%,0 100%); }
  .fm-cine-accent { z-index: 5; background-color: #16b5df; box-shadow: 0 3px rgba(255,255,255,0.76); transform-origin: left center; }
  .fm-cine-slice-a { z-index: 3; background-color: rgba(16,25,29,0.92); transform: rotate(-3deg); }
  .fm-cine-slice-b { z-index: 4; background-color: #16b5df; transform: rotate(-2deg); }
  .fm-cine-node { z-index: 7; width: 7px; height: 7px; opacity: 0; border: 2px solid #16b5df; background-color: #edf1f0; transform: rotate(45deg); }

  .fm-cinematic-structural-out .fm-cine-dark { transform-origin: left center; animation: fm-cine-cover-left 135ms cubic-bezier(0.22,0.74,0.22,1) both; }
  .fm-cinematic-structural-out .fm-cine-light { transform-origin: right center; animation: fm-cine-cover-right 118ms 20ms cubic-bezier(0.22,0.74,0.22,1) both; }
  .fm-cinematic-structural-out .fm-cine-accent { animation: fm-cine-line-forward 138ms ease-out both; }
  .fm-cinematic-structural-out .fm-cine-slice-a,.fm-cinematic-structural-out .fm-cine-slice-b { animation: fm-cine-slice-arrive 110ms 24ms ease-out both; }
  .fm-cinematic-structural-in .fm-cine-dark { transform-origin: left center; animation: fm-cine-reveal-left 245ms 18ms cubic-bezier(0.16,0.82,0.22,1) both; }
  .fm-cinematic-structural-in .fm-cine-light { transform-origin: right center; animation: fm-cine-reveal-right 225ms cubic-bezier(0.16,0.82,0.22,1) both; }
  .fm-cinematic-structural-in .fm-cine-accent { animation: fm-cine-line-reveal 250ms ease-out both; }
  .fm-cinematic-structural-in .fm-cine-slice-a,.fm-cinematic-structural-in .fm-cine-slice-b { animation: fm-cine-slice-leave 165ms ease-in both; }

  .fm-cinematic-sibling-forward-out .fm-cine-dark { transform-origin: left center; animation: fm-cine-cover-left 88ms ease-in both; }
  .fm-cinematic-sibling-forward-out .fm-cine-light { transform-origin: right center; animation: fm-cine-cover-right 80ms 12ms ease-in both; }
  .fm-cinematic-sibling-forward-out .fm-cine-accent { animation: fm-cine-line-forward 92ms ease-out both; }
  .fm-cinematic-sibling-forward-in .fm-cine-dark { transform-origin: right center; animation: fm-cine-reveal-right 165ms ease-out both; }
  .fm-cinematic-sibling-forward-in .fm-cine-light { transform-origin: left center; animation: fm-cine-reveal-left 150ms 12ms ease-out both; }
  .fm-cinematic-sibling-forward-in .fm-cine-accent { animation: fm-cine-line-reveal 168ms ease-out both; }
  .fm-cinematic-sibling-back-out .fm-cine-dark { transform-origin: right center; animation: fm-cine-cover-right 88ms ease-in both; }
  .fm-cinematic-sibling-back-out .fm-cine-light { transform-origin: left center; animation: fm-cine-cover-left 80ms 12ms ease-in both; }
  .fm-cinematic-sibling-back-out .fm-cine-accent { transform-origin: right center; animation: fm-cine-line-back 92ms ease-out both; }
  .fm-cinematic-sibling-back-in .fm-cine-dark { transform-origin: left center; animation: fm-cine-reveal-left 165ms ease-out both; }
  .fm-cinematic-sibling-back-in .fm-cine-light { transform-origin: right center; animation: fm-cine-reveal-right 150ms 12ms ease-out both; }
  .fm-cinematic-sibling-back-in .fm-cine-accent { transform-origin: right center; animation: fm-cine-line-back-reveal 168ms ease-out both; }
  .fm-cinematic-sibling-forward-out .fm-cine-slice-a,.fm-cinematic-sibling-forward-out .fm-cine-slice-b,.fm-cinematic-sibling-back-out .fm-cine-slice-a,.fm-cinematic-sibling-back-out .fm-cine-slice-b { animation: fm-cine-slice-arrive 75ms 15ms ease-out both; }
  .fm-cinematic-sibling-forward-in .fm-cine-slice-a,.fm-cinematic-sibling-forward-in .fm-cine-slice-b,.fm-cinematic-sibling-back-in .fm-cine-slice-a,.fm-cinematic-sibling-back-in .fm-cine-slice-b { animation: fm-cine-slice-leave 105ms ease-in both; }
  .fm-cinematic-sibling-forward-out .fm-cine-node,.fm-cinematic-sibling-back-out .fm-cine-node { animation: fm-cine-node-hit 90ms ease-out both; }
  .fm-cinematic-sibling-forward-in .fm-cine-node,.fm-cinematic-sibling-back-in .fm-cine-node { animation: fm-cine-node-release 130ms ease-out both; }

  .fm-cinematic-deeper-out { animation: fm-cine-grow-from-anchor 112ms cubic-bezier(0.20,0.72,0.20,1) both; }
  .fm-cinematic-deeper-in { animation: fm-cine-collapse-to-anchor 205ms cubic-bezier(0.16,0.82,0.22,1) both; }
  .fm-cinematic-back-out { animation: fm-cine-grow-from-anchor-back 102ms cubic-bezier(0.20,0.72,0.20,1) both; }
  .fm-cinematic-back-in { animation: fm-cine-collapse-to-anchor-back 182ms cubic-bezier(0.16,0.82,0.22,1) both; }
  .fm-cinematic-deeper-out .fm-cine-dark,.fm-cinematic-deeper-in .fm-cine-dark,.fm-cinematic-back-out .fm-cine-dark,.fm-cinematic-back-in .fm-cine-dark { clip-path: polygon(0 0,100% 7%,94% 100%,5% 93%); }
  .fm-cinematic-deeper-out .fm-cine-light,.fm-cinematic-deeper-in .fm-cine-light,.fm-cinematic-back-out .fm-cine-light,.fm-cinematic-back-in .fm-cine-light { clip-path: polygon(7% 0,100% 6%,92% 100%,0 92%); }
  .fm-cinematic-deeper-out .fm-cine-accent,.fm-cinematic-back-out .fm-cine-accent { box-shadow: 4px 0 rgba(255,255,255,0.76); transform-origin: center top; animation: fm-cine-deep-cut 110ms ease-out both; }
  .fm-cinematic-deeper-in .fm-cine-accent,.fm-cinematic-back-in .fm-cine-accent { box-shadow: 4px 0 rgba(255,255,255,0.76); transform-origin: center bottom; animation: fm-cine-deep-cut-reveal 178ms ease-out both; }
  .fm-cinematic-deeper-out .fm-cine-node,.fm-cinematic-back-out .fm-cine-node { animation: fm-cine-node-hit 105ms ease-out both; }
  .fm-cinematic-deeper-in .fm-cine-node,.fm-cinematic-back-in .fm-cine-node { animation: fm-cine-node-release 150ms ease-out both; }

  @keyframes fm-cine-cover-left { 0% { opacity: 0; transform: translateX(-12px) scaleX(0.02); } 35% { opacity: 1; } 100% { opacity: 1; transform: translateX(0) scaleX(1); } }
  @keyframes fm-cine-cover-right { 0% { opacity: 0; transform: translateX(12px) scaleX(0.02); } 35% { opacity: 1; } 100% { opacity: 1; transform: translateX(0) scaleX(1); } }
  @keyframes fm-cine-reveal-left { 0% { opacity: 1; transform: translateX(0) scaleX(1); } 72% { opacity: 1; } 100% { opacity: 0; transform: translateX(-18px) scaleX(0.02); } }
  @keyframes fm-cine-reveal-right { 0% { opacity: 1; transform: translateX(0) scaleX(1); } 72% { opacity: 1; } 100% { opacity: 0; transform: translateX(18px) scaleX(0.02); } }
  @keyframes fm-cine-line-forward { 0% { opacity: 0; transform: scaleX(0.02); } 30% { opacity: 1; } 100% { opacity: 0; transform: scaleX(1); } }
  @keyframes fm-cine-line-reveal { 0% { opacity: 1; transform: scaleX(1); } 100% { opacity: 0; transform: scaleX(0.02); } }
  @keyframes fm-cine-line-back { 0% { opacity: 0; transform: scaleX(0.02); } 30% { opacity: 1; } 100% { opacity: 0; transform: scaleX(1); } }
  @keyframes fm-cine-line-back-reveal { 0% { opacity: 1; transform: scaleX(1); } 100% { opacity: 0; transform: scaleX(0.02); } }
  @keyframes fm-cine-slice-arrive { 0% { opacity: 0; transform: translateX(-18px) rotate(-4deg) scaleX(0.3); } 100% { opacity: 1; transform: translateX(0) rotate(-2deg) scaleX(1); } }
  @keyframes fm-cine-slice-leave { 0% { opacity: 1; transform: translateX(0) rotate(-2deg) scaleX(1); } 100% { opacity: 0; transform: translateX(22px) rotate(2deg) scaleX(0.35); } }
  @keyframes fm-cine-grow-from-anchor { 0% { opacity: 0.92; transform: scale(0.025) rotate(-4deg); } 58% { opacity: 1; transform: scale(1.04) rotate(0.8deg); } 100% { opacity: 1; transform: scale(1) rotate(0); } }
  @keyframes fm-cine-collapse-to-anchor { 0% { opacity: 1; transform: scale(1) rotate(0); } 38% { opacity: 1; transform: scale(1.025) rotate(-0.5deg); } 100% { opacity: 0; transform: scale(0.025) rotate(4deg); } }
  @keyframes fm-cine-grow-from-anchor-back { 0% { opacity: 0.92; transform: scale(0.025) rotate(4deg); } 58% { opacity: 1; transform: scale(1.04) rotate(-0.8deg); } 100% { opacity: 1; transform: scale(1) rotate(0); } }
  @keyframes fm-cine-collapse-to-anchor-back { 0% { opacity: 1; transform: scale(1) rotate(0); } 38% { opacity: 1; transform: scale(1.025) rotate(0.5deg); } 100% { opacity: 0; transform: scale(0.025) rotate(-4deg); } }
  @keyframes fm-cine-deep-cut { 0% { opacity: 0; transform: translateY(-40px) scaleY(0.06); } 35% { opacity: 1; } 100% { opacity: 0; transform: translateY(0) scaleY(1); } }
  @keyframes fm-cine-deep-cut-reveal { 0% { opacity: 0; transform: translateY(0) scaleY(1); } 40% { opacity: 1; } 100% { opacity: 0; transform: translateY(40px) scaleY(0.06); } }
  @keyframes fm-cine-node-hit { 0% { opacity: 0; transform: rotate(45deg) scale(0.2); } 48% { opacity: 1; transform: rotate(45deg) scale(1.45); } 100% { opacity: 0; transform: rotate(45deg) scale(0.75); } }
  @keyframes fm-cine-node-release { 0% { opacity: 0; transform: rotate(45deg) scale(0.75); } 45% { opacity: 1; transform: rotate(45deg) scale(1.35); } 100% { opacity: 0; transform: rotate(45deg) scale(0.2); } }
  .house-page { background-color: #e3e7e6; background-image: linear-gradient(106deg,rgba(0,0,0,0) 0%,rgba(0,0,0,0) 57%,rgba(56,70,75,0.07) 58%,rgba(56,70,75,0.07) 67%,rgba(0,0,0,0) 68%),linear-gradient(106deg,rgba(0,0,0,0) 0%,rgba(0,0,0,0) 66%,rgba(255,255,255,0.32) 67%,rgba(255,255,255,0.32) 77%,rgba(0,0,0,0) 78%); background-repeat: no-repeat,no-repeat; background-size: 100% 100%,100% 100%; }
  [data-action], [data-house-entry] { cursor: pointer; pointer-events: auto; user-select: none; }

  .topbar { position: relative; z-index: 8; width: 100%; height: var(--fm-top); display: flex; align-items: center; padding: 0 7px; border-bottom: 1px solid rgba(57,68,73,0.16); background-color: rgba(237,240,239,0.97); background-image: linear-gradient(106deg,rgba(0,0,0,0) 0%,rgba(0,0,0,0) 61%,rgba(70,82,88,0.13) 62%,rgba(70,82,88,0.13) 72%,rgba(0,0,0,0) 73%),linear-gradient(106deg,rgba(0,0,0,0) 0%,rgba(0,0,0,0) 70%,rgba(255,255,255,0.48) 71%,rgba(255,255,255,0.48) 79%,rgba(0,0,0,0) 80%); background-repeat: no-repeat,no-repeat; background-size: 100% 100%,100% 100%; }
  .back-button { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; flex: 0 0 24px; margin-right: 5px; padding-right: 3px; color: #ffffff; background-color: #20282d; clip-path: polygon(0 0,100% 0,80% 100%,0 100%); font-size: 22px; line-height: 20px; }
  .page-title { width: 100px; display: flex; flex: 0 0 100px; flex-direction: column; overflow: hidden; }
  .page-title strong { overflow: hidden; font-size: 23px; line-height: 20px; white-space: nowrap; }
  .page-title small { margin-top: 1px; overflow: hidden; color: #69757a; font-size: 8px; white-space: nowrap; }
  .readonly { margin-left: 5px; padding: 4px 5px; color: #ffffff; background-color: #626d72; font-size: 9px; }
  .top-action { height: 18px; display: flex; align-items: center; justify-content: center; margin-left: 3px; padding: 0 5px; color: #ffffff; background-color: #252e34; font-size: 9px; }
  .refresh-top { margin-left: auto; color: #263137; border: 1px solid #9ba5a9; background-color: rgba(255,255,255,0.52); }

  .house-sidebar { position: absolute; z-index: 6; left: 0; top: var(--fm-top); width: var(--fm-side); height: var(--fm-body); display: block; overflow: hidden; color: #edf1f2; }
  .house-sidebar-sheet { position: absolute; z-index: 0; left: 0; top: 0; width: 100%; height: 100%; display: block; background-color: rgba(25,33,38,0.99); clip-path: polygon(0 0,100% 0,100% 88%,82% 100%,0 100%); pointer-events: none; }
  .house-sidebar-content { position: relative; z-index: 1; width: 100%; height: 100%; display: flex; flex-direction: column; padding: 10px 4px 7px 6px; }
  .side-heading { width: 100%; height: 31px; display: flex; flex: 0 0 31px; flex-direction: column; justify-content: space-between; padding: 0 0 4px 3px; overflow: hidden; }
  .side-heading small { display: block; color: #89959a; font-size: 8px; line-height: 8px; }
  .side-heading strong { display: block; overflow: hidden; font-size: 17px; line-height: 17px; white-space: nowrap; }
  .side-row { position: relative; width: 100%; min-height: 31px; display: flex; align-items: center; padding: 3px 2px 3px 1px; color: #aeb8bc; border-left: 2px solid transparent; border-bottom: 1px solid rgba(128,145,153,0.18); cursor: pointer; }
  .side-row.active { border-left-color: #16b5df; background-color: #343f46; color: #ffffff; }
  .side-row > b { width: 19px; display: block; flex: 0 0 19px; color: inherit; font-family: "Arial",sans-serif; font-size: 15px; font-weight: normal; }
  .side-row > span { min-width: 0; display: flex; flex: 1; flex-direction: column; overflow: hidden; white-space: nowrap; }
  .side-row strong { display: block; overflow: hidden; color: inherit; font-size: 10px; line-height: 11px; white-space: nowrap; }
  .side-row small { margin-top: 2px; overflow: hidden; color: #93a0a5; font-size: 7px; line-height: 8px; white-space: nowrap; }
  .side-spacer { flex: 1; }
  .range { width: 100%; padding: 5px 3px 2px; border-top: 1px solid #39434a; }
  .range > div { height: 14px; display: flex; align-items: center; color: #a8b2b6; }
  .range span { flex: 1; font-size: 8px; }
  .range b { color: #e3e8e9; font-family: "Arial",sans-serif; font-size: 10px; font-weight: normal; }

  .house-workspace { position: absolute; z-index: 3; left: var(--fm-house-left); top: var(--fm-house-top); width: var(--fm-house-width); height: var(--fm-body); display: flex; flex-direction: column; padding: 8px 9px 0 10px; overflow: hidden; }
  .house-dual { width: 100%; height: var(--fm-house-main); display: flex; flex: 0 0 var(--fm-house-main); flex-direction: row; align-items: flex-start; overflow: hidden; }
  .house-pane { position: relative; height: var(--fm-house-main); display: flex; flex-direction: column; overflow: hidden; transition: background-color 0.12s,box-shadow 0.12s; }
  .house-pane.drop-target { background-color: rgba(22,181,223,0.10); box-shadow: inset 0 0 0 1px rgba(22,181,223,0.72); }
  .pane-head { width: 100%; height: 28px; display: flex; flex: 0 0 28px; align-items: center; overflow: hidden; }
  .pane-head > b { width: 31px; height: 25px; display: flex; flex: 0 0 31px; align-items: center; padding-right: 5px; color: #172027; border-right: 2px solid #16b5df; font-family: "Arial",sans-serif; font-size: 24px; line-height: 25px; font-weight: normal; }

  .pane-head strong { display: block; overflow: hidden; font-size: 15px; line-height: 15px; white-space: nowrap; }
  .pane-head small { display: block; margin-top: 2px; overflow: hidden; color: #667379; font-size: 9px; line-height: 9px; white-space: nowrap; }
  .pane-divider { height: var(--fm-house-main); display: flex; flex: 0 0 auto; align-items: center; justify-content: center; color: #6f7b80; }

  .house-list-shell { position: relative; width: 100%; height: var(--fm-house-list); display: block; flex: 0 0 var(--fm-house-list); overflow: hidden; }
  .house-list { width: 100%; height: var(--fm-house-list); display: block; overflow-x: hidden; overflow-y: hidden; }
  .house-entry { position: relative; display: block; overflow: hidden; color: #ffffff; background-color: #10191d; background-image: linear-gradient(90deg,rgba(5,12,15,0.50) 0%,rgba(17,31,36,0.12) 64%,rgba(55,82,91,0.36) 100%); background-repeat: no-repeat; background-size: 100% 100%; box-shadow: inset 0 -1px rgba(22,181,223,0.42); transition: opacity 0.12s,transform 0.12s; }
  .house-pane.outside .house-entry { box-shadow: inset 0 -1px rgba(241,201,77,0.42); }
  .house-entry:hover { box-shadow: inset 0 0 0 1px #16b5df,inset 0 -2px #16b5df; }
  .house-entry.dragging { opacity: 0.18; transform: translateY(1px); }
  .house-entry-marker { position: absolute; z-index: 7; left: 0; top: 0; bottom: 0; width: 2px; display: block; background-color: #16b5df; pointer-events: none; }
  .house-pane.outside .house-entry-marker { background-color: #f1c94d; }

  .house-entry-copy b { font-size: 13px; line-height: 13px; }
  .house-entry-copy small { margin-top: 3px; color: #d3dade; font-size: 8px; line-height: 8px; }
  .house-entry-number { position: absolute; z-index: 180; right: 5px; top: 4px; color: rgba(255,255,255,0.72); font-family: "Arial",sans-serif; font-size: 8px; }
  .house-entry.foreign-house { box-shadow: inset 0 -1px rgba(241,201,77,0.68); }
  .house-entry.foreign-house .house-entry-copy { right: 47px; }
  .house-entry.foreign-house .house-entry-number { top: 18px; color: rgba(255,255,255,0.58); }
  .house-entry-other-home { position: absolute; z-index: 184; right: 0; top: 0; height: 12px; display: flex; align-items: center; padding: 0 4px 0 7px; overflow: hidden; color: #172027; background-color: #f1c94d; clip-path: polygon(4px 0,100% 0,100% 100%,0 100%); font-size: 6px; line-height: 7px; font-style: normal; white-space: nowrap; }

  .house-scroll-rail { position: absolute; z-index: 8; right: 0; top: 0; width: 1px; height: var(--fm-house-list); display: block; pointer-events: none; }

  .house-footer { position: relative; width: 100%; height: var(--fm-house-footer); display: flex; flex: 0 0 var(--fm-house-footer); align-items: center; border-top: 1px solid rgba(96,108,113,0.20); }
  .house-search { width: 126px; height: 17px; padding: 2px 5px; border: 0; border-bottom: 1px solid #8f999d; background-color: rgba(255,255,255,0.52); color: #172027; font-family: lxgw,sans-serif; font-size: 9px; }
  .house-search-button { width: 32px; height: 17px; display: flex; align-items: center; justify-content: center; margin-left: 3px; color: #3f4b50; border: 1px solid #939da1; background-color: rgba(255,255,255,0.52); font-size: 9px; }
  .house-count { position: absolute; top: 3px; display: flex; align-items: baseline; color: #737f84; }
  .house-count b { color: #172027; font-family: "Arial",sans-serif; font-size: 18px; font-weight: normal; }
  .house-count span { margin-left: 2px; font-family: "Arial",sans-serif; font-size: 8px; }

  .house-partner-grid-shell { position: relative; width: 100%; height: var(--fm-house-list); display: block; flex: 0 0 var(--fm-house-list); overflow: hidden; }
